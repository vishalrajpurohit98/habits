name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ env.ANDROID_HOME }}
      VERSION_CODE: 1
      VERSION_NAME: "1.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Read version
        id: version
        shell: bash
        run: |
          CODE="$(grep '^versionCode=' android-wrapper/version.properties | cut -d= -f2)"
          NAME="$(grep '^versionName=' android-wrapper/version.properties | cut -d= -f2-)"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          test -s "$RUNNER_TEMP/signing/release.jks"

      - name: Build Android APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android-wrapper/build-apk.sh
          ./android-wrapper/build-apk.sh

      - name: Verify APK
        run: |
          test -f dist/PersonalTracker.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/PersonalTracker.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 dist/PersonalTracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalTracker-${{ steps.version.outputs.name }}
          path: dist/PersonalTracker.apk
          if-no-files-found: error
          retention-days: 30
