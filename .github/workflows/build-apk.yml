name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.json'
      - '**.ttf'
      - '**.png'
      - 'android-wrapper/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare web site
        run: |
          rm -rf web-dist
          mkdir -p web-dist
          rsync -a ./ web-dist/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'android-wrapper' \
            --exclude 'web-dist'
      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
      - name: Deploy web site
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"
      - name: Decode keystore from committed file
        run: |
          if [ ! -f android-wrapper/keystore.b64 ]; then
            echo "ERROR: android-wrapper/keystore.b64 not found."
            echo "Run the '(One-time) Generate signing keystore' workflow first."
            exit 1
          fi
          base64 -d android-wrapper/keystore.b64 > "$RUNNER_TEMP/release.keystore"
          echo "Decoded keystore: $(stat -c%s "$RUNNER_TEMP/release.keystore") bytes"
      - name: Read key alias
        id: alias
        run: |
          if [ -f android-wrapper/keystore.alias ]; then
            echo "value=$(cat android-wrapper/keystore.alias | tr -d '\n\r ')" >> "$GITHUB_OUTPUT"
          else
            echo "value=personaltracker" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute version
        id: ver
        run: |
          # versionCode must strictly increase; use the workflow run number.
          CODE="${{ github.run_number }}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=6.24" >> "$GITHUB_OUTPUT"
          echo "Using versionCode=$CODE versionName=6.24"

      - name: Build APK
        working-directory: android-wrapper
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          BUILD_TOOLS_VER: 35.0.0
          PLATFORM_VER: android-34
          WEB_DIR: ..
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ steps.alias.outputs.value }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WEB_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GITHUB_REPO_API: https://api.github.com/repos/${{ github.repository }}/commits/main
          OUT_APK: ${{ github.workspace }}/PersonalTracker.apk
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalTracker-apk
          path: PersonalTracker.apk
          if-no-files-found: error
      - name: Publish to Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: PersonalTracker.apk
          make_latest: true
