name: Generate Android Signing Keystore — RUN ONLY ONCE

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type I_UNDERSTAND_THIS_CREATES_THE_PRODUCTION_SIGNING_KEY"
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    if: ${{ inputs.confirm == 'I_UNDERSTAND_THIS_CREATES_THE_PRODUCTION_SIGNING_KEY' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Refuse accidental regeneration
        env:
          SIGNING_KEY_INITIALIZED: ${{ vars.SIGNING_KEY_INITIALIZED }}
        run: |
          if [ "$SIGNING_KEY_INITIALIZED" = "true" ]; then
            echo "::error::SIGNING_KEY_INITIALIZED=true. Refusing to generate another production key."
            exit 1
          fi

      - name: Generate keystore
        env:
          KEY_ALIAS: personaltracker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          PASS="$(openssl rand -base64 32 | tr -d '\n=/+' | cut -c1-32)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/keystore/release.jks" \
            -storetype JKS \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Personal Tracker, OU=Mobile, O=Personal Tracker, L=NA, ST=NA, C=IN"
          printf '%s' "$PASS" > "$RUNNER_TEMP/keystore/KEYSTORE_PASSWORD.txt"
          printf '%s' "$KEY_ALIAS" > "$RUNNER_TEMP/keystore/KEY_ALIAS.txt"
          base64 -w 0 "$RUNNER_TEMP/keystore/release.jks" > "$RUNNER_TEMP/keystore/release.jks.base64"

      - name: Upload one-time key artifact
        uses: actions/upload-artifact@v4
        with:
          name: PERSONAL-TRACKER-KEYSTORE-ONE-TIME
          path: |
            ${{ runner.temp }}/keystore/release.jks
            ${{ runner.temp }}/keystore/release.jks.base64
            ${{ runner.temp }}/keystore/KEYSTORE_PASSWORD.txt
            ${{ runner.temp }}/keystore/KEY_ALIAS.txt
          retention-days: 1

      - name: Security warning
        run: |
          echo "IMPORTANT: Treat the one-time artifact as production signing material."
          echo "Download it immediately, create GitHub Secrets, then delete the artifact."
          echo "Set repository variable SIGNING_KEY_INITIALIZED=true."
          echo "Never commit the keystore, password, or base64 value to the repository."
