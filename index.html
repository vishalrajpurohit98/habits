<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Personal Tracker</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
@font-face{
  font-family:'Unbounded';
  src:url('unbounded.ttf') format('truetype');
  font-weight:700;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Space Grotesk';
  src:url('spacegrotesk.ttf') format('truetype');
  font-weight:400 600;font-display:swap;
}
@font-face{
  font-family:'Bricolage';
  src:url('bricolage.ttf') format('truetype');
  font-weight:400 800;font-display:swap;
}
@font-face{
  font-family:'Fraunces';
  src:url('fraunces.ttf') format('truetype');
  font-weight:600;font-style:normal;font-display:swap;
}
/* ============ THEME TOKENS ============ */
:root{
  --bg:#000000;--bg2:#0C0B09;--card:#17150F;--card2:#242017;--card3:#2B251C;
  --line:rgba(255,244,224,.10);--line2:rgba(255,244,224,.18);
  --ink:#FFFFFF;--ink2:#E0DAD0;--mut:#BEB5A6;--mut2:#8A8278;
  --amber:#FFAE1F;--amberDeep:#E08900;--amberSoft:rgba(255,174,31,.14);
  --coral:#FF6B5E;--coralSoft:rgba(255,107,94,.13);
  --green:#3ECF8E;--ice:#4EA8FF;--iceSoft:rgba(78,168,255,.14);
  --gline:rgba(255,244,224,.07);--ringOff:rgba(255,244,224,.14);--ringOffDim:rgba(255,244,224,.05);
  --barOff:rgba(255,244,224,.1);--onAccent:#171310;
  --dockBg:rgba(7,6,5,.92);--scrimBg:rgba(0,0,0,.8);
  --shadow:0 1px 6px rgba(0,0,0,.18);--shadowUp:0 -4px 20px rgba(0,0,0,.25);
  --grad-amber:linear-gradient(135deg,#FFAE1F,#E08900);
  --emberGlow:radial-gradient(circle,rgba(255,174,31,.16) 0%,rgba(255,174,31,0) 62%);
  --sBlue:#4EA8FF;--sGreen:#3ECF8E;--sYellow:#FFD43B;--sPurple:#9B7BFF;--sOrange:#FF9F43;
  --sOrangeSoft:rgba(255,159,67,.14);--sYellowSoft:rgba(255,212,59,.13);
  --fDisp:var(--fDisp);
  --fBody:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
/* ---- font themes (whole-app typography) ---- */
html.font-nothing{--fDisp:var(--fDisp);--fBody:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html.font-apple{--fDisp:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;--fBody:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif}
html.font-google{--fDisp:'Space Grotesk','Roboto',sans-serif;--fBody:'Roboto','Noto Sans',-apple-system,sans-serif}
html.font-space{--fDisp:'Space Grotesk',sans-serif;--fBody:'Space Grotesk',-apple-system,sans-serif}
html.font-bricolage{--fDisp:'Bricolage',sans-serif;--fBody:'Bricolage',-apple-system,sans-serif}
html.font-serif{--fDisp:'Fraunces',Georgia,serif;--fBody:'Fraunces',Georgia,serif}
html.font-system{--fDisp:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--fBody:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html.light{
  --bg:#F6F1E7;--bg2:#FBF8F1;--card:#FFFFFF;--card2:#EFE8DA;--card3:#E4DBC8;
  --line:rgba(46,36,22,.10);--line2:rgba(46,36,22,.20);
  --ink:#111111;--ink2:#3A3428;--mut:#706858;--mut2:#9E9688;
  --amber:#DE8500;--amberDeep:#B96E00;--amberSoft:rgba(222,133,0,.13);
  --coral:#E3554A;--coralSoft:rgba(227,85,74,.12);
  --green:#199D66;--ice:#2E7FD6;--iceSoft:rgba(46,127,214,.13);
  --gline:rgba(46,36,22,.09);--ringOff:rgba(46,36,22,.18);--ringOffDim:rgba(46,36,22,.07);
  --barOff:rgba(46,36,22,.12);--onAccent:#FFF9EE;
  --dockBg:rgba(255,255,255,.88);--scrimBg:rgba(38,30,18,.42);
  --shadow:0 1px 4px rgba(70,55,30,.07);--shadowUp:0 -2px 12px rgba(70,55,30,.1);
  --grad-amber:linear-gradient(135deg,#EE9500,#C97800);
  --emberGlow:radial-gradient(circle,rgba(222,133,0,.13) 0%,rgba(222,133,0,0) 62%);
  --sBlue:#1D6FD1;--sGreen:#149C63;--sYellow:#C79400;--sPurple:#6D4AE8;--sOrange:#E07B00;
  --sOrangeSoft:rgba(224,123,0,.12);--sYellowSoft:rgba(199,148,0,.12);
}
/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html.grey{filter:grayscale(1)}
body{background:var(--bg);color:var(--ink);
  font-family:var(--fBody);
  font-size:15.5px;line-height:1.5;overscroll-behavior:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-appearance:none}
input,textarea{font-family:inherit;-webkit-appearance:none}
::-webkit-scrollbar{width:0;height:0}
.serif{font-family:var(--fDisp)}

#app{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 18px calc(180px + env(safe-area-inset-bottom,0px)) 18px}
.page{display:none;animation:fadeUp .3s ease-out}.page.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ HEADER ============ */
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
h1{font-family:var(--fDisp);font-size:30px;font-weight:700;letter-spacing:-.3px;line-height:1.2}

/* ============ HERO RING ============ */
.hero{display:flex;flex-direction:column;align-items:center;margin:4px 0 4px;position:relative}
.hero::before{content:'';position:absolute;top:50%;left:50%;width:200px;height:200px;
  transform:translate(-50%,-52%);background:var(--emberGlow);pointer-events:none;opacity:.5}
.ringSvg{width:170px;height:170px;position:relative}
.ringSvg circle{transition:stroke-dasharray .4s ease-out}
.ringN{font-family:var(--fDisp);font-size:38px;font-weight:700}
.ringT{font-family:var(--fDisp);font-size:14px;font-weight:700}
.ringL{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.heroFlame{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--sOrange);
  background:var(--sOrangeSoft);border-radius:20px;padding:6px 14px;display:none}
.heroFlame.on{display:inline-block}

.qod{font-style:italic;font-size:14px;font-weight:500;color:var(--mut);
  line-height:1.55;margin:8px 0 14px;text-align:center;padding:0 12px}
.nextRem{font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:14px;
  padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  display:flex;align-items:center;gap:9px;box-shadow:none}
.nextRem b{color:var(--ink)}
.nextRem .remIcon{color:var(--amber);flex-shrink:0}
.nextRem:empty{display:none;padding:0;border:none;margin:0;box-shadow:none}

/* ============ AI INSIGHTS ============ */
.aiCard{background:var(--card);border:1px solid var(--line);border-radius:14px;animation:cardSlideIn .2s ease-out;
  padding:13px 15px;margin-bottom:10px;display:flex;align-items:flex-start;gap:11px}
.aiCard .aiIco{font-size:18px;flex-shrink:0;margin-top:1px}
.aiCard .aiBody{flex:1;min-width:0}
.aiCard .aiTitle{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:2px}
.aiCard .aiText{font-size:13px;color:var(--mut);line-height:1.5}
.aiCard .aiText b{color:var(--ink);font-weight:700}
.aiCard .aiTag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;padding:3px 8px;border-radius:6px;margin-top:6px}
.aiTag.pos{background:rgba(62,207,142,.12);color:var(--sGreen)}
.aiTag.neg{background:var(--coralSoft);color:var(--coral)}
.aiTag.info{background:var(--amberSoft);color:var(--amber)}
.aiTag.neutral{background:var(--card2);color:var(--mut)}
#aiInsights .secH{margin-top:16px;margin-bottom:8px}
#aiInsights .askBtn{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:11px 15px;margin-top:6px;display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:600;color:var(--mut);width:100%}
#aiInsights .askBtn:active{background:var(--card2)}
#aiInsights .askBtn .askIco{color:var(--sPurple);font-size:16px}

/* ============ UNIVERSAL AI ASSISTANT ============ */
.uaiBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;margin-bottom:14px}
.uaiLog{max-height:400px;overflow-y:auto;padding:4px 14px 0}
.uaiLog:empty{padding:0}
.uaiInputRow{display:flex;gap:6px;padding:12px;border-top:1px solid var(--line)}
.uaiInp{flex:1;border:none;background:var(--card2);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink)}
.uaiInp:focus{outline:none;box-shadow:0 0 0 2px var(--amberSoft)}
.uaiMic{width:42px;height:42px;border-radius:12px;background:var(--card2);border:1px solid var(--line);
  font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.uaiMic:active{background:var(--card3)}
.uaiSend{width:42px;height:42px;border-radius:12px;background:var(--amber);color:var(--onAccent);
  font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.uaiSend:active{transform:scale(.94)}
.uaiHints{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.uaiHint{font-size:11.5px;font-weight:600;color:var(--mut);background:var(--card2);
  padding:5px 10px;border-radius:20px;white-space:nowrap}
.uaiHint:active{background:var(--card3)}
.uaiMsg{padding:10px 0;border-bottom:1px solid var(--line);animation:cardSlideIn .2s ease-out}
.uaiMsg:last-child{border-bottom:none}
.uaiMsg.user{color:var(--ink);font-size:14px;font-weight:600}
.uaiMsg.bot{color:var(--ink);font-size:13.5px;line-height:1.55}
.uaiMsg.bot b{color:var(--amber)}
.uaiMsg .uaiAction{margin-top:8px;padding:10px 14px;background:var(--card2);border-radius:12px;font-size:13px}
.uaiMsg .uaiAction .uaiCheck{color:var(--sGreen);font-weight:700;font-size:14px}
.uaiMsg .uaiAction .uaiDetail{color:var(--mut);font-size:12px;margin-top:2px}
.uaiMsg .uaiBtns{display:flex;gap:8px;margin-top:6px}
.uaiMsg .uaiBtns button{font-size:12px;font-weight:600;padding:4px 12px;border-radius:8px;
  background:var(--card);border:1px solid var(--line);color:var(--mut)}
.uaiMsg .uaiBtns button:active{background:var(--card2)}
.uaiMsg.err{color:var(--coral);font-size:12px;padding:6px 0}
.uaiMsg .uaiConfirm{margin-top:6px}
.uaiMsg .uaiOpt{display:block;padding:8px 12px;margin:4px 0;background:var(--card2);border-radius:10px;
  font-size:13px;color:var(--ink);border:1px solid var(--line)}
.uaiMsg .uaiOpt:active{background:var(--card3);border-color:var(--amber)}
.aiMsg{padding:10px 14px;border-radius:14px;margin-bottom:8px;font-size:13.5px;line-height:1.55;max-width:90%}
.aiMsg.user{background:var(--amberSoft);color:var(--ink);margin-left:auto;text-align:right}
.aiMsg.bot{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.aiMsg.bot b{color:var(--amber)}
.aiMsg.err{background:var(--coralSoft);color:var(--coral);font-size:12px}
.nlBar{display:flex;gap:8px;margin-bottom:12px}
.nlBar .inp{flex:1}
.nlBar .nlSend{flex-shrink:0;padding:0 14px;background:var(--amber);color:var(--onAccent);
  border-radius:14px;font-weight:700;font-size:13px}

/* ============ BANNERS ============ */
.banner{background:var(--coralSoft);border:1px solid var(--coral);border-radius:14px;
  padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.banner .bt{flex:1;font-size:13.5px;line-height:1.4}
.banner .bt b{color:var(--coral)}
.bbtn{background:var(--coral);color:#FFF6F4;font-weight:700;font-size:12.5px;
  border-radius:12px;padding:10px 14px;flex-shrink:0}
.bbtn:active{transform:scale(.95)}

/* ============ SECTION HEADERS ============ */
.secH{font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);
  margin:22px 2px 12px;display:flex;align-items:center;gap:0}
.secH::before{display:none}

/* ============ HABIT CARD ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px 11px;margin-bottom:10px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;transition:transform .15s ease;
  display:flex;align-items:center;gap:14px}
.cwrap{flex:1;min-width:0}
.card:active{transform:scale(.985)}
.crow{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.emo{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px}
.cstreak{font-size:13px;font-weight:700;margin-top:2px}
.crem{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.crem .pill{font-size:10.5px;font-weight:700;color:var(--mut);background:var(--card2);
  border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:4px}
.crem .pill .pi{color:var(--amber)}

.chk{width:38px;height:38px;border-radius:10px;flex-shrink:0;align-self:flex-start;margin-top:2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2.5px solid var(--cs);color:transparent;font-size:11px;font-weight:800;
  transition:all .15s cubic-bezier(.22,.68,.36,1)}
.chk:active{transform:scale(.8)}
.chk.on{background:var(--c);border-color:var(--c);color:var(--onAccent);box-shadow:0 2px 8px var(--cg);animation:chkPop .25s cubic-bezier(.22,.68,.36,1)}
@keyframes chkPop{0%{transform:scale(.8)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.chk.part{color:var(--ink)}
.chk svg{width:22px;height:22px}
.chk .cv{line-height:1.1}
.ribbon{width:100%;height:auto;display:block;margin-top:4px}

/* ============ STACK ============ */
.stackCard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.stackT{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.sRow{display:flex;align-items:center;gap:12px;position:relative;padding:8px 0}
.sLine{position:absolute;left:16px;top:38px;bottom:-8px;width:2px;background:var(--card2)}
.sLine.onL{background:var(--amber)}
.sDot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;background:var(--card2);flex-shrink:0;border:2px solid transparent;z-index:1}
.sRow.cur .sDot{border-color:var(--amber)}
.sRow.dn .sDot{background:var(--amberSoft)}
.sName{flex:1;font-size:15px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sRow.dn .sName{color:var(--mut);text-decoration:line-through}
.sChk{font-size:17px;color:var(--mut2)}
.sRow.dn .sChk{color:var(--sGreen)}

/* ============ EMPTY ============ */
.empty{text-align:center;padding:36px 24px 0;color:var(--mut)}
.empty .big{font-size:46px;margin-bottom:12px}
.empty .t{font-family:var(--fDisp);font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px}
.empty .s{font-size:15px;line-height:1.6}

/* ============ FAB + DOCK ============ */
#fab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));
  height:44px;border-radius:22px;background:var(--amber);color:var(--onAccent);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 18px 0 14px;
  font-size:14px;font-weight:700;letter-spacing:.1px;
  box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:10;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
#fab:active{transform:scale(.93)}
#fab svg{width:22px;height:22px}
.dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--dockBg);border:1px solid var(--line);border-radius:22px;display:flex;z-index:15;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);padding:4px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;
  color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.3px;border-radius:16px;transition:all .22s}
.tab svg{width:23px;height:23px}
.navBrand{display:none}
.tab.on{color:var(--amberDeep);background:var(--amberSoft)}
.tab.on svg{fill:currentColor;fill-opacity:.08}
.tab:active{transform:scale(.96);transition:transform .1s}
html:not(.light) .tab.on{color:var(--amber)}

/* ============ MATERIAL ACTIONS ============ */
.materialActionSheet{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.actionIntro{font-size:12px;color:var(--mut);margin:-8px 0 14px}
.actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actionItem{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);transition:transform .14s,background .18s,border-color .18s}
.actionItem:active{transform:scale(.97);background:var(--card2);border-color:var(--primary)}
.actionIcon{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--primarySoft);font-size:20px}
.actionText{min-width:0}.actionTitle{font-size:13px;font-weight:800}.actionSub{font-size:10.5px;color:var(--mut);margin-top:3px}
.materialSearch{border-radius:18px!important;background:var(--card)!important;border-color:var(--line2)!important;padding-left:16px!important}
.materialSearch:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px var(--primarySoft)}
.snack{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);box-shadow:var(--shadowUp);transform:translateY(130%);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.22,.68,.36,1),opacity .2s}
.snack.on{transform:translateY(0);opacity:1}.snackMsg{font-size:13px;font-weight:700;flex:1}.snackAction{font-size:12px;font-weight:800;color:var(--primary);padding:6px 4px}
@media(min-width:700px){.snack{left:calc(50% - 344px);right:calc(50% - 344px)}}

/* ============ SHEETS ============ */
#scrim{position:fixed;inset:0;background:var(--scrimBg);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:62;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);
  border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
  padding:8px 20px calc(26px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.32,.72,.24,1);
  z-index:64;max-height:92%;overflow-y:auto;box-shadow:var(--shadowUp);pointer-events:none}
.sheet.open{transform:translateY(0);pointer-events:auto;transition:transform .26s cubic-bezier(.22,.68,.36,1)}
.grab{width:36px;height:3px;border-radius:2px;background:var(--line2);margin:6px auto 16px}
.sheet h2{font-family:var(--fDisp);font-size:20px;font-weight:700;letter-spacing:0;margin-bottom:16px}
.lbl{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin:18px 0 10px}
.inp{width:100%;background:var(--card);border:1.5px solid var(--line2);border-radius:14px;
  padding:14px 16px;font-size:16px;color:var(--ink);caret-color:var(--amber);outline:none;
  transition:border-color .2s}
.inp:focus{border-color:var(--amber)}
.inp::placeholder{color:var(--mut2)}
textarea.inp{resize:none;min-height:68px}
.half{display:flex;gap:10px}.half>*{flex:1}

/* ============ CHIPS / PICKERS ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line2);border-radius:22px;padding:8px 14px;
  font-size:14px;font-weight:600;color:var(--mut);transition:all .12s ease-out}
.chip.sel{background:var(--amberSoft);border-color:var(--amber);color:var(--ink)}
.dows{display:flex;gap:8px;margin-top:10px}
.dw{width:38px;height:38px;border-radius:10px;background:var(--card);border:1.5px solid var(--line2);
  font-size:12px;font-weight:700;color:var(--mut)}
.dw.sel{background:var(--amberSoft);border-color:var(--amber);color:var(--ink)}
.numRow{display:flex;align-items:center;gap:10px;margin-top:10px}
.numRow .inp{width:86px;flex:none;text-align:center}
.numRow span{font-size:13.5px;color:var(--mut)}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ebtn{font-size:23px;padding:10px 0;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
  line-height:1.3;transition:all .15s}
.ebtn:active{transform:scale(.9)}
.ebtn.sel{background:var(--amberSoft);border-color:var(--amber);transform:scale(1.06)}
.cgrid{display:flex;flex-wrap:wrap;gap:13px}
.cbtn{width:38px;height:38px;border-radius:50%;transition:transform .15s}
.cbtn:active{transform:scale(.85)}
.cbtn.sel{box-shadow:0 0 0 3px var(--bg2),0 0 0 6px currentColor;transform:scale(1.05)}

/* ============ REMINDER & DATE PICKER BUTTONS ============ */
.remRow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.remTime{flex:1;background:var(--card);border:1.5px solid var(--line2);border-radius:13px;
  padding:13px 15px;font-size:15px;font-weight:700;color:var(--ink);text-align:left;
  display:flex;align-items:center;gap:9px}
.remTime .ri{color:var(--amber)}
.remTime:active{border-color:var(--amber)}
.remDel{width:42px;height:42px;border-radius:13px;background:var(--coralSoft);
  color:var(--coral);font-size:20px;flex-shrink:0}
.addT{font-size:13.5px;font-weight:700;color:var(--amber);padding:8px 2px}
.swRow{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;font-size:14px;gap:12px}
.swRow small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px;line-height:1.4}
.dateBtn{width:100%;background:var(--card);border:1.5px solid var(--line2);border-radius:14px;
  padding:14px 15px;font-size:14.5px;font-weight:700;color:var(--ink);text-align:left}
.dateBtn .dLbl{display:block;font-size:10px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--mut);margin-bottom:3px}
.dateBtn:active{border-color:var(--amber)}
.endWrap{position:relative}
.endClr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border-radius:10px;color:var(--coral);font-size:17px}

/* ============ TOGGLE ============ */
.tog{width:48px;height:27px;border-radius:14px;background:var(--card2);border:1.5px solid var(--line2);
  position:relative;flex-shrink:0;transition:all .25s;cursor:pointer}
.tog::after{content:'';position:absolute;left:3px;top:2.5px;width:19px;height:19px;border-radius:50%;
  background:var(--mut);transition:all .25s cubic-bezier(.34,1.2,.64,1)}
.tog.on{background:var(--amberSoft);border-color:var(--amber)}
.tog.on::after{left:23px;background:var(--amber)}

/* ============ BUTTONS ============ */
.primary{width:100%;background:var(--grad-amber);color:var(--onAccent);font-size:16px;font-weight:800;
  border-radius:17px;padding:16px;margin-top:24px;letter-spacing:.2px;
  box-shadow:0 5px 18px rgba(0,0,0,.25);transition:transform .15s}
.primary:active{transform:scale(.97)}
.danger{width:100%;border:1.5px solid var(--coral);color:var(--coral);font-size:15px;font-weight:700;
  border-radius:17px;padding:14px;margin-top:12px;transition:background .2s}
.danger.armed{background:var(--coralSoft)}
.ghost{width:100%;border:1.5px solid var(--line2);color:var(--ink);font-size:15px;font-weight:700;
  border-radius:17px;padding:14px;margin-top:12px;background:var(--card)}

/* ============ DETAIL ============ */
.drow{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.emo.bigE{width:58px;height:58px;border-radius:18px;font-size:28px}
.dname{font-family:var(--fDisp);font-size:17px;font-weight:700;letter-spacing:0}
.dsub{font-size:12px;color:var(--mut);margin-top:3px}
.dquote{font-style:italic;font-size:13px;font-weight:600;color:var(--mut);margin:8px 0 4px;line-height:1.45}
.stats{display:flex;gap:8px;margin:10px 0 8px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 4px;text-align:center}
.sv{font-size:18px;font-weight:800}
.sl{font-size:8.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-top:4px}
.fzRow{display:flex;align-items:center;gap:10px;background:var(--iceSoft);border:1px solid var(--ice);
  border-radius:15px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.fzRow b{color:var(--ice)}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav button{width:42px;height:42px;font-size:22px;color:var(--mut);border-radius:13px;
  background:var(--card);border:1px solid var(--line)}
.mnav button:disabled{opacity:.2}
#mTitle{font-family:var(--fDisp);font-size:12.5px;font-weight:700}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.dow span{text-align:center;font-size:10.5px;font-weight:700;color:var(--mut)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.mday{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;color:var(--mut);background:var(--card)}
.mday.blank{background:none}
.mday.done{color:var(--onAccent);font-weight:800}
.mday.froz{background:var(--ice);color:#FFF;font-weight:800}
.mday.miss{box-shadow:0 0 0 1.5px var(--coral) inset}
.mday.today{box-shadow:0 0 0 2px var(--ink) inset}
.mday.future{opacity:.22}
.fzBar{display:none;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:14px}
.fzBar.on{display:block}
.fzBar .ft{font-size:13.5px;margin-bottom:10px;line-height:1.4}
.fzBar .fbtns{display:flex;gap:8px}
.fzBar .fbtns button{flex:1;border-radius:13px;padding:11px;font-size:13px;font-weight:700}
.bFz{background:var(--iceSoft);border:1px solid var(--ice);color:var(--ice)}
.bMk{background:var(--amberSoft);border:1px solid var(--amber);color:var(--amberDeep)}
html:not(.light) .bMk{color:var(--amber)}

/* ============ STATS PAGE ============ */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:10px 0;border-radius:11px;font-size:13px;font-weight:700;color:var(--mut);transition:all .2s}
.seg button.sel{background:var(--amberSoft);color:var(--amberDeep)}
html:not(.light) .seg button.sel{color:var(--amber)}
.chartBox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:10px;box-shadow:var(--shadow)}
.chartBox svg{width:100%;height:auto;display:block}
.chartT{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.legend span{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px 15px;box-shadow:var(--shadow)}
.tv{font-size:20px;font-weight:800;letter-spacing:-.2px}
.tv small{font-size:10.5px;color:var(--mut);font-weight:700;font-family:-apple-system,sans-serif}
.tl{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin-top:4px}
.tsub{font-size:11px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insight{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  font-size:13.5px;line-height:1.5;margin-bottom:10px;display:flex;gap:11px;box-shadow:var(--shadow)}
.insight .ii{flex-shrink:0;font-size:18px}
.repGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

/* ============ SETTINGS ============ */
.setCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.setRow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setRow:last-child{border-bottom:none}
.setCol{padding:14px 0;border-bottom:1px solid var(--line)}
.setCol:last-child{border-bottom:none}
.setInfo{flex:1;min-width:0}
.setT{font-size:14.5px;font-weight:700}
.setS{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.4}
.sbtn{background:var(--card2);border:1.5px solid var(--line2);border-radius:13px;padding:9px 14px;
  font-size:12.5px;font-weight:700;flex-shrink:0}
.sbtn:active{transform:scale(.94)}
.sbtn.warn{color:var(--coral);border-color:var(--coral)}
.sbtn.acc{color:var(--amberDeep);border-color:var(--amber)}
html:not(.light) .sbtn.acc{color:var(--amber)}

/* ============ LOCK ============ */
#lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:30px}
#lock.on{display:flex}
.lockIcon{width:60px;height:60px;border-radius:20px;background:var(--amberSoft);
  display:flex;align-items:center;justify-content:center;margin-bottom:22px;
  border:1px solid var(--line2)}
.lockIcon svg{width:28px;height:28px;stroke:var(--amber)}
.lockT{font-family:var(--fDisp);font-size:22px;font-weight:700;margin-bottom:7px;letter-spacing:-.3px}
.lockS{font-size:13.5px;color:var(--mut);margin-bottom:32px}
.dots{display:flex;gap:15px;margin-bottom:40px;height:15px}
.dots i{width:13px;height:13px;border-radius:50%;background:transparent;border:2px solid var(--line2);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .18s,border-color .18s}
.dots i.f{background:var(--amber);border-color:var(--amber);transform:scale(1.15)}
@keyframes lockShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.dots.err{animation:lockShake .4s}
.dots.err i{border-color:var(--coral)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:18px}
.pk{width:72px;height:72px;border-radius:50%;background:var(--card);font-size:26px;font-weight:600;
  border:1px solid var(--line);color:var(--ink);position:relative;overflow:hidden;
  transition:transform .12s,background .15s}
.pk:active{background:var(--card3);transform:scale(.9)}
.pk.ghostK{background:none;border:none;font-size:20px;color:var(--mut)}
.pk.ghostK:active{background:none;transform:scale(.85)}

.syncDot{width:11px;height:11px;border-radius:50%;background:var(--mut2);flex-shrink:0;transition:background .3s}
.syncDot.on{background:var(--sGreen);box-shadow:0 0 8px var(--sGreen)}
.syncDot.busy{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.syncDot.err{background:var(--coral)}

/* ============ TODAY SYNC ACTION ============ */
.todaySyncBar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px 9px 12px;margin:10px 0 14px;transition:border-color .2s,background .2s}
.todaySyncState{display:flex;align-items:center;gap:9px;min-width:0}
.todaySyncDot{width:8px;height:8px;border-radius:50%;background:var(--mut2);flex:0 0 auto;transition:background .25s,box-shadow .25s}
.todaySyncDot.synced{background:var(--sGreen);box-shadow:0 0 7px var(--sGreen)}
.todaySyncDot.syncing{background:var(--amber);box-shadow:0 0 7px var(--amber);animation:todaySyncPulse 1s ease-in-out infinite}
.todaySyncDot.cached{background:var(--mut2)}
.todaySyncDot.error{background:var(--coral);box-shadow:0 0 7px var(--coral)}
.todaySyncText{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todaySyncSub{font-size:10.5px;color:var(--mut);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todaySyncBtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:74px;height:34px;padding:0 11px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);color:var(--sBlue);font-size:12px;font-weight:800;transition:transform .12s,background .15s,border-color .15s;flex:0 0 auto}
.todaySyncBtn:active{transform:scale(.96);background:var(--card3)}
.todaySyncBtn svg{width:14px;height:14px}
.todaySyncBtn.busy svg{animation:todaySyncSpin .9s linear infinite}
.todaySyncBar.disabled{opacity:.82}
@keyframes todaySyncPulse{50%{opacity:.45}}
@keyframes todaySyncSpin{to{transform:rotate(360deg)}}
#syncCfgIn{width:100%}

/* ============ DAILY INSIGHT + CALENDAR ============ */
.dailyIns{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,var(--amberSoft),transparent);
  border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin:2px 0 12px}
.dailyIns .diLead{font-size:20px;flex-shrink:0}
.dailyIns .diText{font-size:13.5px;font-weight:600;line-height:1.4;color:var(--ink)}
.dailyIns .diText b{font-weight:800}
.calCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:6px}
.calNav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calNav button{width:32px;height:32px;border-radius:10px;background:var(--card2);color:var(--ink);font-size:16px}
.calNav #calTitle{font-family:var(--fDisp);font-size:13px;font-weight:700}
.calDow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.calDow span{text-align:center;font-size:9px;font-weight:800;color:var(--mut)}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calCell{aspect-ratio:1;border-radius:10px;background:var(--card2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;position:relative;cursor:pointer;transition:background .15s;padding:2px}
.calCell.empty{background:transparent;cursor:default}
.calCell.hasData{background:var(--card3)}
.calCell.today{outline:2px solid var(--amber);outline-offset:-2px}
.calCell.sel{background:var(--amberSoft);outline:2px solid var(--amber);outline-offset:-2px}
.calCell .cnum{font-size:11px;font-weight:800;color:var(--ink2)}
.calCell.empty .cnum{color:transparent}
.calDots{display:flex;gap:2px;height:5px}
.calDots i{width:5px;height:5px;border-radius:50%}
.calLegend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.calLegend span{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--mut)}
.calLegend i{width:8px;height:8px;border-radius:50%}
.calDay{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:16px;box-shadow:var(--shadow);animation:fadeUp .22s ease-out}
.calDayHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calDayTitle{font-family:var(--fDisp);font-size:16px;font-weight:700}
.calDayClose{width:30px;height:30px;border-radius:10px;background:var(--card2);color:var(--mut);font-size:13px}
.diRow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.diRow:last-child{border-bottom:none}
.diRow .diIco{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.diRow .diL{font-size:13px;font-weight:800;color:var(--mut);width:78px;flex-shrink:0}
.diRow .diV{font-size:14px;font-weight:700;flex:1;text-align:right}

/* ============ STATS (minimal) ============ */
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.statGrid .sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.statGrid .sc b{font-family:var(--fDisp);font-size:26px;font-weight:700;letter-spacing:-.5px;display:block;line-height:1}
.statGrid .sc b small{font-size:14px;font-weight:700}
.statGrid .sc span{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-top:7px;display:block}
.trendSeg{display:flex;gap:6px;margin-bottom:12px}
.trendSeg button{padding:7px 16px;border-radius:11px;font-size:12px;font-weight:800;background:var(--card2);color:var(--mut);transition:all .2s}
.trendSeg button.sel{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.perfGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.perfCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.perfCard .pl{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:9px}
.perfCard .pe{font-size:22px;margin-bottom:5px}
.perfCard .pn{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perfCard .pp{font-size:12.5px;font-weight:800;margin-top:3px}
.perfCard.best{border-color:rgba(62,207,142,.3)}
.perfCard.best .pp{color:var(--sGreen)}
.perfCard.att{border-color:rgba(255,159,67,.3)}
.perfCard.att .pp{color:var(--sOrange)}
.achvCompact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:6px}
.achvCompact .ah{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.achvCompact .at{font-size:13px;font-weight:800}
.achvCompact .av{font-size:12px;font-weight:800;color:var(--sBlue)}
.achvRow{display:flex;gap:9px}
.achvB{flex:1;aspect-ratio:1;border-radius:14px;background:var(--card2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;border:1.5px solid transparent;position:relative}
.achvB.won{background:var(--amberSoft);border-color:var(--amber)}
.achvB .abn{font-family:var(--fDisp);font-size:17px;font-weight:700;color:var(--mut2)}
.achvB.won .abn{color:var(--amber)}
.achvB .abd{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut2)}
.achvB.won .abd{color:var(--amber)}
.achvB .lock{position:absolute;top:5px;right:6px;font-size:8px;opacity:.5}
#achvModal{position:fixed;inset:0;background:var(--scrimBg);z-index:64;display:none;align-items:flex-end;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#achvModal.on{display:flex}
.achvSheet{background:var(--bg2);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;width:100%;
  max-height:80%;overflow-y:auto;padding:8px 20px calc(26px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadowUp)}
.achvFullGrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px}

.chipAdd{border:1.5px dashed var(--sBlue)!important;color:var(--sBlue)!important;background:transparent!important;font-weight:800}
.newCatRow{display:flex;gap:8px;margin:0 0 6px}
.newCatRow .inp{flex:1;margin:0}
.newCatRow .ncOk,.newCatRow .ncX{width:46px;flex-shrink:0;border-radius:13px;font-size:16px;font-weight:800}
.newCatRow .ncOk{background:var(--grad-amber);color:var(--onAccent)}
.newCatRow .ncX{background:var(--card2);color:var(--mut)}

/* ============ SLEEP ============ */
.sleepCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:6px;box-shadow:var(--shadow)}
.sleepMain{display:flex;align-items:center;gap:14px}
.sleepIco{width:46px;height:46px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.sleepInfo{flex:1;min-width:0}
.sleepInfo b{font-family:var(--fDisp);font-size:22px;font-weight:700;display:block;line-height:1}
.sleepInfo span{font-size:12px;color:var(--mut);margin-top:4px;display:block}
.sleepLogBtn{padding:10px 16px;border-radius:13px;background:var(--sPurple);color:#0F0A1E;font-size:13px;font-weight:800;flex-shrink:0}
.sleepEmpty{display:flex;align-items:center;gap:14px}
.sleepEmpty .se2{flex:1;font-size:13px;color:var(--mut)}
.sleepCorr{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);line-height:1.5}
.sleepCorr b{color:var(--sPurple)}
.sleepBars{display:flex;gap:5px;margin-top:12px;align-items:flex-end;height:44px}
.sleepBars .sb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end}
.sleepBars .sb i{width:100%;max-width:22px;background:var(--sPurple);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.sleepBars .sb span{font-size:8px;font-weight:800;color:var(--mut)}
.sleepTimes{display:flex;gap:10px;margin-bottom:14px}
.sleepTime{flex:1;background:var(--card2);border-radius:16px;padding:14px;text-align:center;border:1.5px solid var(--line2)}
.sleepTime .stl{display:block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.sleepTime .stv{display:block;font-family:var(--fDisp);font-size:22px;font-weight:700}
.sleepDur{text-align:center;font-family:var(--fDisp);font-size:30px;font-weight:700;color:var(--sPurple);margin-bottom:16px;min-height:36px}

/* ============ WORKOUT ============ */
.wkCard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.wkCard .wch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wkCard .wct{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.wkCard .wcgo{font-size:12px;font-weight:800;color:var(--sBlue)}
.wkExRow{display:flex;align-items:center;gap:11px;padding:9px 0}
.wkExRow .wei{width:34px;height:34px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.wkExRow .wen{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkExRow .wev{font-family:var(--fDisp);font-size:14px;font-weight:700;flex-shrink:0}
.wkExRow .wev.done{color:var(--sGreen)}
.wkMini{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:5px}
.wkMini i{display:block;height:100%;border-radius:4px;background:var(--sBlue)}
.wkMini i.done{background:var(--sGreen)}
.wkCardEmpty{text-align:center;padding:6px 0}
.wkCardEmpty .wce{font-size:30px;margin-bottom:6px}
.wkCardEmpty .wct2{font-size:14px;font-weight:700;margin-bottom:3px}
.wkCardEmpty .wcs{font-size:12px;color:var(--mut)}

#wkModule{position:fixed;inset:0;background:var(--bg);z-index:58;display:none;flex-direction:column}
#wkModule.on{display:flex;animation:fadeUp .28s ease-out}
.wkHead{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;border-bottom:1px solid var(--line)}
.wkBack,.wkAddBtn{width:40px;height:40px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wkBack svg,.wkAddBtn svg{width:22px;height:22px;stroke:var(--ink)}
.wkAddBtn{background:var(--grad-amber)}.wkAddBtn svg{stroke:var(--onAccent)}
.wkHt{flex:1;font-family:var(--fDisp);font-size:20px;font-weight:700}
.wkBody{flex:1;overflow-y:auto;padding:16px 16px calc(30px + env(safe-area-inset-bottom,0px))}
.exCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 6px;margin-bottom:10px;box-shadow:var(--shadow);transition:border-color .2s}
.exCard.open{border-color:var(--line2)}
.exHeadRow{display:flex;align-items:center;gap:12px;padding:11px 10px;cursor:pointer;border-radius:14px;transition:background .15s}
.exHeadRow:active{background:var(--card2)}
.exChev{width:20px;height:20px;color:var(--mut);flex-shrink:0;transition:transform .25s}
.exCard.open .exChev{transform:rotate(180deg)}
.exBarTop{margin:0 10px 8px}
.exCard.open .exBarTop{margin:2px 10px 6px}
.exDetail{padding:4px 10px 8px;animation:fadeUp .22s ease-out}
.exTop{display:flex;align-items:center;gap:12px}
.exIco{width:42px;height:42px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.exNm{flex:1;min-width:0}
.exNm b{font-size:15px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exNm span{font-size:11.5px;color:var(--mut)}
.exVal{text-align:right;flex-shrink:0}
.exVal b{font-family:var(--fDisp);font-size:17px;font-weight:700;display:block}
.exVal b.done{color:var(--sGreen)}
.exVal span{font-size:10px;color:var(--mut)}
.exBar{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;margin:11px 0 4px}
.exBar i{display:block;height:100%;border-radius:4px;background:var(--sBlue);transition:width .35s}
.exBar i.done{background:var(--sGreen)}
.exStats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.exStats div{text-align:center}
.exStats b{font-family:var(--fDisp);font-size:14px;font-weight:700;display:block}
.exStats span{font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.exActions{display:flex;gap:8px;margin-top:12px}
.exLogBtn{flex:1;height:44px;border-radius:13px;background:var(--grad-amber);color:var(--onAccent);font-size:14px;font-weight:800}
.exEditBtn{width:44px;height:44px;border-radius:13px;background:var(--card2);color:var(--ink);font-size:16px;flex-shrink:0}
.exChart{margin-top:12px}
.chartSeg{display:flex;gap:5px;margin-bottom:8px}
.chartSeg button{padding:5px 11px;border-radius:9px;font-size:10.5px;font-weight:800;background:var(--card2);color:var(--mut)}
.chartSeg button.sel{background:var(--card3);color:var(--ink)}
.prBadge{display:inline-flex;align-items:center;gap:4px;background:var(--sYellowSoft);color:var(--sYellow);border-radius:10px;padding:3px 8px;font-size:10.5px;font-weight:800;margin-left:8px}
.logGoal{font-size:13px;color:var(--mut);margin-bottom:14px;text-align:center}
.logStepRow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logStep{width:56px;height:56px;border-radius:16px;background:var(--card2);color:var(--ink);font-size:24px;font-weight:700;flex-shrink:0}
.logStep:active{transform:scale(.9)}
.setRowLog{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.setRowLog .sn{width:52px;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;flex-shrink:0}
.setRowLog input{flex:1}
.setRowLog .sx{width:38px;height:38px;border-radius:11px;background:var(--card2);color:var(--coral);font-size:15px;flex-shrink:0}
.addSetBtn{width:100%;height:42px;border-radius:12px;background:var(--card2);color:var(--sBlue);font-size:13px;font-weight:800;margin-bottom:12px}
.prNote{text-align:center;font-size:13px;font-weight:800;color:var(--sYellow);margin-bottom:12px}
.fitSec{margin-top:6px}
.histSummary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.histSummary div{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.histSummary b{font-family:var(--fDisp);font-size:15px;font-weight:700;display:block}
.histSummary span{font-size:8.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin-top:3px;display:block}
.histDay{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.histDay:last-child{border-bottom:none}
.histDay .hd{flex:1;min-width:0}
.histDay .hdd{font-size:13.5px;font-weight:800}
.histDay .hds{font-size:11px;color:var(--mut);margin-top:2px}
.histDay .hdv{font-family:var(--fDisp);font-size:15px;font-weight:700;flex-shrink:0}
.histDay .hdv.pr{color:var(--sYellow)}
.histEdit{width:34px;height:34px;border-radius:11px;background:var(--card2);color:var(--sBlue);font-size:14px;flex-shrink:0}
.histEmpty{text-align:center;color:var(--mut);font-size:13px;padding:30px 0}

/* ============ MILESTONE ============ */
#miles{position:fixed;inset:0;background:var(--scrimBg);z-index:55;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#miles.on{display:flex}
.mCard{background:var(--card);border:1.5px solid var(--sYellow);border-radius:28px;
  padding:40px 48px;text-align:center;animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
.mNum{font-family:var(--fDisp);font-size:46px;font-weight:700;color:var(--sYellow);letter-spacing:0}
.mTxt{font-size:17px;font-weight:700;margin-top:2px}
.mHab{font-size:13.5px;color:var(--mut);margin-top:10px}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;z-index:56;pointer-events:none;display:none}

/* ============ HEATMAP / TIMER / JOURNAL / TEMPLATES ============ */
.hm{display:grid;gap:3px}
.hm i{aspect-ratio:1;border-radius:3px;display:block;background:var(--card2)}
.hmWrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.hmT{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.hmT small{font-size:11px;color:var(--mut);font-weight:600}
.tmr{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.tmrVal{font-family:var(--fDisp);font-size:19px;font-weight:700;min-width:104px;letter-spacing:.5px}
.tmrB{flex:1;border-radius:12px;padding:11px 0;font-size:13px;font-weight:700;border:1.5px solid var(--line2);background:var(--card2)}
.tmrB.go{background:var(--amberSoft);border-color:var(--amber);color:var(--amberDeep)}
html:not(.light) .tmrB.go{color:var(--amber)}
.jrIn{display:flex;gap:8px;margin-bottom:10px}
.jrIn .inp{flex:1;padding:11px 14px;font-size:14px}
.jrIn button{width:46px;border-radius:13px;background:var(--amberSoft);border:1.5px solid var(--amber);color:var(--amberDeep);font-size:16px;flex-shrink:0}
html:not(.light) .jrIn button{color:var(--amber)}
.jrRow{font-size:12.5px;color:var(--ink2);padding:7px 2px;border-bottom:1px solid var(--line);line-height:1.45}
.jrRow b{color:var(--mut);font-weight:700;font-size:11px;margin-right:7px}
.jrRow:last-child{border-bottom:none}
.mday{position:relative}
.nd{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--amber)}
.banner.ice{background:var(--iceSoft);border-color:var(--ice)}
.banner.ice .bt b{color:var(--ice)}
.bbtn.ice{background:var(--ice);color:#FFF}
.tplRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tpl{flex:none;background:var(--card);border:1.5px solid var(--line2);border-radius:14px;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tpl:active{border-color:var(--amber);transform:scale(.96)}

/* ============ PALETTES ============ */
.chip .pd{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}
html:not(.light).p-lagoon{--amber:#2FC6A0;--amberDeep:#23A886;--amberSoft:rgba(47,198,160,.15);
  --grad-amber:linear-gradient(135deg,#2FC6A0,#1D9E75);--emberGlow:radial-gradient(circle,rgba(47,198,160,.14) 0%,rgba(47,198,160,0) 62%);
  --card:#0E1512;--card2:#1B2822;--card3:#273A31}
html.light.p-lagoon{--amber:#0E9F78;--amberDeep:#0B7D5F;--amberSoft:rgba(14,159,120,.12);
  --grad-amber:linear-gradient(135deg,#16B389,#0B8A66);--emberGlow:radial-gradient(circle,rgba(14,159,120,.12) 0%,rgba(14,159,120,0) 62%);
  --bg:#EEF5F1;--bg2:#F8FCFA;--card2:#E2EFE8;--card3:#D2E5DB}
html:not(.light).p-frost{--amber:#58A9FF;--amberDeep:#3A8AE8;--amberSoft:rgba(88,169,255,.16);
  --grad-amber:linear-gradient(135deg,#58A9FF,#2F7FDE);--emberGlow:radial-gradient(circle,rgba(88,169,255,.14) 0%,rgba(88,169,255,0) 62%);
  --card:#0D1218;--card2:#19232E;--card3:#243342;--ice:#9BE8F0;--iceSoft:rgba(155,232,240,.14)}
html.light.p-frost{--amber:#1D6FD1;--amberDeep:#1558A8;--amberSoft:rgba(29,111,209,.12);
  --grad-amber:linear-gradient(135deg,#2E7EDD,#1558A8);--emberGlow:radial-gradient(circle,rgba(29,111,209,.12) 0%,rgba(29,111,209,0) 62%);
  --bg:#EEF3FA;--bg2:#F8FAFD;--card2:#E1EAF5;--card3:#D0DEEF;--ice:#0FA3B8;--iceSoft:rgba(15,163,184,.12)}
html:not(.light).p-sakura{--amber:#F06BB3;--amberDeep:#D14E96;--amberSoft:rgba(240,107,179,.15);
  --grad-amber:linear-gradient(135deg,#F06BB3,#C74387);--emberGlow:radial-gradient(circle,rgba(240,107,179,.14) 0%,rgba(240,107,179,0) 62%);
  --card:#150F13;--card2:#251A21;--card3:#35252F}
html.light.p-sakura{--amber:#C93B84;--amberDeep:#A32C6A;--amberSoft:rgba(201,59,132,.12);
  --grad-amber:linear-gradient(135deg,#D14E96,#A32C6A);--emberGlow:radial-gradient(circle,rgba(201,59,132,.12) 0%,rgba(201,59,132,0) 62%);
  --bg:#F8EFF3;--bg2:#FCF7F9;--card2:#F0DFE8;--card3:#E5CDDA}
html:not(.light).p-violet{--amber:#9B7BFF;--amberDeep:#7E5CF0;--amberSoft:rgba(155,123,255,.16);
  --grad-amber:linear-gradient(135deg,#9B7BFF,#6C4AE0);--emberGlow:radial-gradient(circle,rgba(155,123,255,.14) 0%,rgba(155,123,255,0) 62%);
  --card:#12101A;--card2:#201C2E;--card3:#2E2840}
html.light.p-violet{--amber:#6D4AE8;--amberDeep:#5638C4;--amberSoft:rgba(109,74,232,.12);
  --grad-amber:linear-gradient(135deg,#7B5AF0,#5638C4);--emberGlow:radial-gradient(circle,rgba(109,74,232,.12) 0%,rgba(109,74,232,0) 62%);
  --bg:#F1EFFA;--bg2:#F9F8FD;--card2:#E5E0F5;--card3:#D6CFEE}
html:not(.light).p-mono{--amber:#E9E4DA;--amberDeep:#C9C4BA;--amberSoft:rgba(233,228,218,.13);
  --grad-amber:linear-gradient(135deg,#E9E4DA,#BDB8AE);--emberGlow:radial-gradient(circle,rgba(233,228,218,.09) 0%,rgba(233,228,218,0) 62%)}
html.light.p-mono{--amber:#2A241C;--amberDeep:#14100B;--amberSoft:rgba(42,36,28,.1);
  --grad-amber:linear-gradient(135deg,#3A332A,#171310);--emberGlow:radial-gradient(circle,rgba(42,36,28,.08) 0%,rgba(42,36,28,0) 62%)}

/* ============ SEARCH / FILTER ============ */
.h1row{display:flex;align-items:center;justify-content:space-between}
.srchBtn{width:42px;height:42px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--mut)}
.srchBtn.on{background:var(--amberSoft);border-color:var(--amber);color:var(--amberDeep)}
html:not(.light) .srchBtn.on{color:var(--amber)}
.srchBtn svg{width:19px;height:19px}
.srchWrap{display:none;margin:12px 0 2px}
.srchWrap.on{display:block;animation:fadeUp .25s ease-out}

/* ============ MOOD TRACKER ============ */
.moPrompt{font-family:var(--fDisp);font-size:14px;font-weight:700}
.moGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.moBtn{background:var(--card2);border:1.5px solid var(--line2);border-radius:14px;padding:10px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s}
.moBtn:active{transform:scale(.92)}
.moBtn .me{font-size:24px;line-height:1.15}
.moBtn .ml{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.moGrid.mini{grid-template-columns:repeat(8,1fr);gap:6px}
.moGrid.mini .moBtn{padding:8px 0;border-radius:11px}
.moGrid.mini .me{font-size:18px}
.mday.mood{font-size:16px}
.mdRow{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:12px;font-weight:700}
.mdRow .mde{width:22px;text-align:center;font-size:15px;flex-shrink:0}
.mdRow .mdl{width:62px;color:var(--ink2);flex-shrink:0}
.mdRow .bar{flex:1;height:9px;border-radius:5px;background:var(--card2);overflow:hidden}
.mdRow .bar i{display:block;height:100%;border-radius:5px}
.mdRow .mdc{width:24px;text-align:right;color:var(--mut);flex-shrink:0}

/* ============ JOURNAL ============ */
.jrCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;
  margin-bottom:13px;box-shadow:var(--shadow)}
.jrCard:active{transform:scale(.985)}
.jrDt{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.jrTt{font-family:var(--fDisp);font-size:14px;font-weight:700;margin-bottom:4px}
.jrSnip{font-size:13px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.jrThRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.jrTh{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--card2)}
.jrPhW{position:relative}
.jrPhX{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--coral);
  color:#FFF;font-size:13px;line-height:22px;text-align:center;font-weight:800}
.jrTags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.jrTag{font-size:10.5px;font-weight:800;color:var(--amberDeep);background:var(--amberSoft);border-radius:14px;padding:4px 10px}
html:not(.light) .jrTag{color:var(--amber)}
.otdRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.otdRow:last-child{border-bottom:none}
.otdRow .oy{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--amberDeep);
  background:var(--amberSoft);border-radius:10px;padding:4px 8px;flex-shrink:0}
html:not(.light) .otdRow .oy{color:var(--amber)}
.otdRow .ot{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.promptCard{background:var(--card);border:1.5px dashed var(--line2);border-radius:16px;padding:15px 16px;margin-bottom:16px}
.promptCard .pq{font-size:13.5px;font-style:italic;color:var(--ink2);line-height:1.5;margin:5px 0 12px}

/* AMOLED true-black surfaces */
html.amoled{--bg:#000000;--bg2:#000000;--card:#000000;--card2:#090909;--card3:#111111;
  --line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.18);--shadow:none;
  --dockBg:rgba(0,0,0,.88);--amberSoft:rgba(255,174,31,.10)}
html.amoled .card,html.amoled .setCard,html.amoled .jrCard,html.amoled .focusCard,
html.amoled .chartBox,html.amoled .hmWrap,html.amoled .stackCard{box-shadow:none}
html.amoled .hero::before{display:none}
html.amoled body,html.amoled #app,html.amoled .page{background:#000000!important}
html.amoled .card,html.amoled .setCard,html.amoled .jrCard,html.amoled .focusCard,html.amoled .chartBox,html.amoled .hmWrap,html.amoled .stackCard,html.amoled .promptCard,html.amoled .empty,html.amoled .aiCfg,html.amoled .uaiBox{background:#000000!important;box-shadow:none!important}
html.amoled .sheet,html.amoled .modal,html.amoled .bottomSheet{background:#090909!important}


/* focus-first home */
.heroTop{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.momCol{flex:1;min-width:0}
.momBig{font-family:var(--fDisp);font-size:42px;font-weight:700;line-height:1;letter-spacing:-1px}
.momBig small{font-size:20px;font-weight:700}
.momLbl{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:4px 0 8px}
.chainLine{font-size:13px;font-weight:800;color:var(--sOrange)}
.heroTop .hero{margin:0;flex-shrink:0}
.heroTop .hero svg{width:118px;height:118px}
.dayMsg{font-style:italic;font-size:13px;color:var(--mut);margin:2px 0 12px}
.focusCard{border-radius:18px;padding:12px 14px;margin:0 0 14px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow)}
.fMini{display:flex;align-items:center;gap:12px}
.fMini .fEmo{font-size:26px;flex-shrink:0}
.fTxt{flex:1;min-width:0}
.fLbl{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-bottom:1px}
.fName{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fVal{font-family:var(--fDisp);font-size:16px;font-weight:700;color:var(--fc,var(--amber));flex-shrink:0}
.fBtn{flex-shrink:0;width:46px;height:46px;border-radius:14px;background:var(--fc,var(--amber));color:var(--onAccent);
  font-size:18px;font-weight:800;transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
.fBtn:active{transform:scale(.9)}
@keyframes valPop{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
.fVal.pop{animation:valPop .32s cubic-bezier(.34,1.56,.64,1)}
.closeCard{border:1.5px solid rgba(155,123,255,.45);background:linear-gradient(160deg,rgba(155,123,255,.12),rgba(155,123,255,.02));

.ccT{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--sPurple);margin-bottom:10px}
.ccLine{font-size:13.5px;font-weight:700;margin:5px 0;color:var(--ink2)}
.ccScore{font-family:var(--fDisp);font-size:40px;font-weight:700;color:var(--sPurple);margin:10px 0 2px}
.ccQ{font-style:italic;font-size:12.5px;color:var(--mut);margin-bottom:12px}
.ccBtn{width:100%;height:50px;border-radius:16px;background:var(--sPurple);color:#0F0A1E;
  font-size:15px;font-weight:800}
.ccDone{font-size:14px;font-weight:800;color:var(--sPurple);text-align:center;padding:6px 0}
.moWhy{margin-top:12px}
.moWhy .setS{margin-bottom:8px;font-weight:700}
.simpleRow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.simpleRow:last-child{border-bottom:none}
.simpleRow .si{width:26px;text-align:center;font-size:16px}
.simpleRow b{margin-left:auto;font-size:15px;font-weight:800}

/* week dots + rest day */
.wkRow{display:flex;gap:6px;margin:0 0 14px}
.wkC{flex:1;text-align:center;font-size:8.5px;font-weight:800;letter-spacing:.5px;color:var(--mut)}
.wkC i{display:block;width:10px;height:10px;border-radius:50%;margin:3px auto 0;
  background:transparent;border:1.5px solid var(--line2)}
.wkC i.p{background:var(--sGreen);border-color:var(--sGreen)}
.wkC i.h{background:var(--sOrangeSoft);border-color:var(--sOrange)}
.wkC i.z{border-color:var(--mut)}
.wkC.n{opacity:.35}
.restCard{background:linear-gradient(150deg,rgba(62,207,142,.10),rgba(62,207,142,.02));
  border:1px solid rgba(62,207,142,.3);border-radius:16px;padding:22px 18px;text-align:center;
  margin:4px 0 14px;box-shadow:var(--shadow)}
.restCard .re{font-size:34px;margin-bottom:6px}
.restCard .rt{font-family:var(--fDisp);font-size:17px;font-weight:700;margin-bottom:5px}
.restCard .rs{font-size:13px;color:var(--ink2)}

/* ============ EXPENSE TRACKER ============ */
.expSum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.expSum .es{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.expSum .es b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}
.expSum .es span{font-size:8.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-top:3px;display:block}
.expMon{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.expMon button{width:34px;height:34px;border-radius:11px;background:var(--card2);color:var(--ink);font-size:17px}
.expMon #expMonTitle{font-family:var(--fDisp);font-size:13px;font-weight:700}
.segX{display:flex;gap:5px;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto}
.segX button{flex:1;white-space:nowrap;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:800;color:var(--mut);transition:all .2s}
.segX button.sel{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.txRow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.txRow:last-child{border-bottom:none}
.txIco{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--card2)}
.txMid{flex:1;min-width:0}
.txMid .tn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txMid .ts{font-size:11.5px;color:var(--mut);margin-top:2px}
.txAmt{font-family:var(--fDisp);font-size:15px;font-weight:700;flex-shrink:0}
.txAmt.exp{color:var(--coral)}
.txAmt.inc{color:var(--sGreen)}
.txAmt.xfer{color:var(--sBlue)}
.txDay{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:14px 0 2px}
.budgRow{margin:14px 0}
.budgRow .bh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.budgRow .bh .over{color:var(--coral)}
.budgBar{height:9px;border-radius:5px;background:var(--card2);overflow:hidden}
.budgBar i{display:block;height:100%;border-radius:5px;background:var(--sGreen);transition:width .4s}
.budgBar i.warn{background:var(--sYellow)}
.budgBar i.over{background:var(--coral)}
.acctCard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.acctCard .ai{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--card2);flex-shrink:0}
.acctCard .an{flex:1;min-width:0}
.acctCard .an b{font-size:14px;font-weight:800;display:block}
.acctCard .an span{font-size:11px;color:var(--mut);text-transform:capitalize}
.acctCard .abal{font-family:var(--fDisp);font-size:15px;font-weight:700}
.abal.neg{color:var(--coral)}
.insCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.insCard .il{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.insCard .iv{font-family:var(--fDisp);font-size:18px;font-weight:700}
.insCard .iv small{font-size:12px;font-weight:800}
.catBar{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:12.5px;font-weight:700}
.catBar .cbn{width:96px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catBar .cbr{flex:1;height:9px;border-radius:5px;background:var(--card2);overflow:hidden}
.catBar .cbr i{display:block;height:100%;background:var(--amber)}
.catBar .cba{width:70px;text-align:right;flex-shrink:0;color:var(--ink2)}
.numPad{font-family:var(--fDisp);font-size:34px;font-weight:700;text-align:center;padding:6px 0 2px}
.kindSeg{display:flex;gap:6px;margin-bottom:14px}
.kindSeg button{flex:1;padding:11px;border-radius:12px;font-size:13px;font-weight:800;background:var(--card2);color:var(--mut)}
.kindSeg button.sel[data-k="exp"]{background:var(--coral);color:#fff}
.kindSeg button.sel[data-k="inc"]{background:var(--sGreen);color:#08120c}
.kindSeg button.sel[data-k="xfer"]{background:var(--sBlue);color:#04121f}
.pickGrid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}
.pickGrid button{padding:9px 13px;border-radius:20px;font-size:12.5px;font-weight:700;background:var(--card2);border:1.5px solid var(--line2);color:var(--ink2)}
.pickGrid button.sel{background:var(--amberSoft);border-color:var(--amber);color:var(--amber)}
.miniLink{font-size:12px;font-weight:800;color:var(--sBlue);padding:8px 2px;display:inline-block}
.catEditRow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.catEditRow b{flex:1;font-size:14px;font-weight:800}
.catEditRow .x{color:var(--coral);font-size:13px;font-weight:800;padding:4px 8px}
.subChip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:14px;padding:5px 10px;font-size:11.5px;font-weight:700;margin:3px 4px 0 0}
.subChip .x{color:var(--coral);cursor:pointer}

/* ============ MOTION & PREMIUM SURFACES ============ */
@keyframes ringIn{from{opacity:0;transform:rotate(-16deg) scale(.92)}to{opacity:1;transform:none}}
.ringSvg{animation:ringIn .5s cubic-bezier(.34,1.4,.64,1)}
@keyframes drawL{to{stroke-dashoffset:0}}
.animLine{stroke-dasharray:600;stroke-dashoffset:600;animation:drawL .9s .1s ease-out forwards}
@keyframes barUp{from{transform:scaleY(0)}}
.animBar{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .55s cubic-bezier(.3,1.2,.4,1) both}
.qrow{display:flex;gap:8px;margin:2px 0 14px}
.qchip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;
  text-align:center;box-shadow:var(--shadow)}
.qchip b{font-size:16.5px;font-weight:800;display:block;letter-spacing:-.2px}
.qchip b small{font-size:10px;font-weight:800;color:var(--mut)}
.qchip span{font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.glass{background:linear-gradient(150deg,var(--sYellowSoft),rgba(255,212,59,.03));
  border:1px solid var(--sYellow);border-radius:16px;padding:16px;margin-bottom:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.badges{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}
.badge{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--fDisp);font-size:11px;font-weight:700;
  background:var(--card2);color:var(--mut2);border:1.5px solid var(--line2)}
.badge.won{background:var(--sYellowSoft);border-color:var(--sYellow);color:var(--sYellow);
  box-shadow:0 0 14px rgba(255,212,59,.22)}
.heroStat{display:flex;gap:14px;align-items:center;padding:18px 18px !important}
.lbl .lic{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);display:inline-block;
  margin-right:8px;background:var(--lc,var(--amber));vertical-align:1px}
.emptyCtaBtn{display:inline-block;background:var(--grad-amber);color:var(--onAccent);font-size:13.5px;
  font-weight:800;border-radius:16px;padding:12px 22px;margin-top:18px}
.moWeek{display:flex;gap:6px;margin-bottom:12px}
.moWeek i{flex:1;aspect-ratio:1;border-radius:50%;background:var(--card2);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-style:normal}
@media (min-width:640px){
  #app{max-width:600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .dock{left:50%;right:auto;transform:translateX(-50%);width:min(568px,calc(100% - 32px))}
  #fab{right:calc(50% - 284px)}
}
@media (min-width:900px){
  #fab{right:calc(50% - 300px)}
}

/* ============ DESKTOP LAYOUT ============ */
@media (min-width:1000px){
  /* left sidebar navigation (transforms the bottom dock) */
  #tabbar.dock{
    left:0; right:auto; top:0; bottom:0; transform:none;
    width:248px; flex-direction:column; align-items:stretch; justify-content:flex-start;
    border-radius:0; border:none; border-right:1px solid var(--line2);
    background:var(--bg2); backdrop-filter:none; -webkit-backdrop-filter:none;
    box-shadow:none; padding:22px 14px; gap:4px;
  }
  .navBrand{
    display:flex; align-items:center; gap:10px; font-family:var(--fDisp);
    font-size:18px; font-weight:700; color:var(--ink); padding:6px 12px 18px;
  }
  .navBrand .navLogo{color:var(--amber);font-size:20px}
  #tabbar .tab{
    flex:none; flex-direction:row; justify-content:flex-start; gap:14px;
    padding:13px 14px; font-size:14.5px; letter-spacing:.2px; border-radius:14px;
  }
  #tabbar .tab svg{width:22px;height:22px}
  #tabbar .tab:hover{background:var(--card2)}
  #tabbar .tab.on:hover{background:var(--amberSoft)}

  /* content shifts right of the sidebar; page centered with room to breathe */
  #app{
    margin-left:248px; max-width:none;
    border-left:none; border-right:none;
    padding:34px 40px 64px;
  }
  .page{max-width:780px;margin:0 auto}

  /* primary action button: bottom-right of the viewport */
  #fab{
    right:44px; bottom:40px; left:auto;
  }
  #fab:hover{filter:brightness(1.05)}

  /* bottom sheets become centered modals */
  .sheet{
    left:50%; right:auto; top:50%; bottom:auto;
    width:min(480px, calc(100vw - 340px)); max-height:86vh;
    border-radius:24px; border:1px solid var(--line2);
    transform:translate(-50%, calc(-50% + 16px)); opacity:0;
    transition:transform .28s cubic-bezier(.32,.72,.24,1), opacity .2s ease;
  }
  .sheet.open{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}

  /* achievements modal: center it too */
  #achvModal{align-items:center;justify-content:center}
  .achvSheet{
    border-radius:24px; border:1px solid var(--line2);
    width:min(560px, calc(100vw - 340px)); max-height:80vh;
  }

  /* full-screen workout module respects the sidebar and centers its content */
  #wkModule{left:248px}
  .wkBody{max-width:820px;margin:0 auto;width:100%}
  .wkHead{max-width:820px;margin:0 auto;width:100%}

  /* mouse hover affordances */
  .habitCard:hover,.exCard:hover,.txRow:hover,.acctCard:hover{border-color:var(--line2)}
  .calCell.hasData:hover{filter:brightness(1.12)}
  .sbtn:hover,.exLogBtn:hover,.sleepLogBtn:hover{filter:brightness(1.06)}

  /* allow text selection on desktop (content), keep nav/buttons unselectable */
  .page{ -webkit-user-select:text; user-select:text }
}

/* extra breathing room on very wide screens */
@media (min-width:1400px){
  .page{max-width:860px}
}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* FINAL AMOLED ENFORCEMENT: data-theme is the source of truth and wins over palette/light overrides */
html[data-theme="amoled"]{
  color-scheme:dark!important;
  --bg:#000000!important;--bg2:#000000!important;
  --card:#000000!important;--card2:#090909!important;--card3:#111111!important;
  --line:rgba(255,255,255,.11)!important;--line2:rgba(255,255,255,.18)!important;
  --ink:#FFFFFF!important;--ink2:#E0E0E0!important;--mut:#A8A8A8!important;--mut2:#777777!important;
  --dockBg:rgba(0,0,0,.96)!important;--scrimBg:rgba(0,0,0,.88)!important;
  --shadow:none!important;--shadowUp:none!important;
  --surface0:#000000!important;--surface1:#050505!important;--surface2:#0E0E0E!important;
}
html[data-theme="amoled"] body,
html[data-theme="amoled"] #app,
html[data-theme="amoled"] .page,
html[data-theme="amoled"] main,
html[data-theme="amoled"] header,
html[data-theme="amoled"] section,
html[data-theme="amoled"] .content,
html[data-theme="amoled"] .settingsPage{
  background:#000000!important;color:#FFFFFF!important;
}
html[data-theme="amoled"] .card,
html[data-theme="amoled"] .setCard,
html[data-theme="amoled"] .jrCard,
html[data-theme="amoled"] .focusCard,
html[data-theme="amoled"] .chartBox,
html[data-theme="amoled"] .hmWrap,
html[data-theme="amoled"] .stackCard,
html[data-theme="amoled"] .promptCard,
html[data-theme="amoled"] .empty,
html[data-theme="amoled"] .aiCfg,
html[data-theme="amoled"] .uaiBox,
html[data-theme="amoled"] .sheet,
html[data-theme="amoled"] .modal,
html[data-theme="amoled"] .bottomSheet{
  background:#000000!important;box-shadow:none!important;
}
html[data-theme="amoled"] .sheet,
html[data-theme="amoled"] .modal,
html[data-theme="amoled"] .bottomSheet{background:#090909!important}
html[data-theme="amoled"] input,
html[data-theme="amoled"] textarea,
