/* ================= LAYOUT EDITOR + RECEIPT SCANNER ================= */
var layoutDefs = {};
var layoutStateKey = 'habit_layout_v1';
function layoutLoad(){ try{return JSON.parse(localStorage.getItem(layoutStateKey)||'{}');}catch(e){return {};} }
function layoutSave(o){ try{localStorage.setItem(layoutStateKey,JSON.stringify(o));}catch(e){} }
var layoutState = layoutLoad();
function layoutLabel(el){
  var id=el.id||'';
  var map={todayDIWrap:'Today insight',heroTop:'Momentum',restBox:'Rest day',wkdots:'Weekly overview',wkCard:'Weekly summary',qod:'Daily message',nextRem:'Next reminder',aiInsights:'AI insights',recoverBox:'Recovery',stackBox:'Routine stack',list:'Today\'s habits',empty:'Empty state',expSum:'Money summary',expMonNav:'Month',expSeg:'Money views',expSrchWrap:'Search & filters',expTx:'Transactions',expBudg:'Budgets',expAcct:'Accounts',expIns:'Insights',expEmpty:'Empty state',stMain:'Statistics',moWeek:'Mood history',moStats:'Mood statistics',moIns:'Mood insights',jrList:'Journal entries',otdCard:'On this day',uaiBox:'AI assistant',aiRecent:'Recent AI activity',aiCfg:'AI configuration'};
  if(map[id]) return map[id];
  var t=el.querySelector('.lbl,.setT,.moPrompt,.aiRecentTitle');
  return t ? (t.textContent||'Section').trim().slice(0,40) : (id||'Section');
}
function ensureLayoutWrap(page, nodes, key){
  var existing=page.querySelectorAll(':scope > .layoutSection');
  if(existing.length) return Array.prototype.slice.call(existing);
  var out=[];
  nodes.forEach(function(n){
    if(!n||!n.parentNode)return;
    var isSeed=n.classList.contains('layoutSectionSeed');
    var content=isSeed?Array.prototype.slice.call(n.childNodes):[n];
    var w=isSeed?n:document.createElement('div');
    w.className='layoutSection';
    w.dataset.layoutKey=key+'_'+(n.id||Math.random().toString(36).slice(2));
    if(!isSeed){n.parentNode.insertBefore(w,n);}
    var head=document.createElement('div');
    head.className='layoutSectionHead';
    head.innerHTML='<span class="layoutSectionGrip">☰</span><span class="layoutSectionTitle"></span><div class="layoutSectionBtns"><button class="layoutUp">↑</button><button class="layoutDown">↓</button><button class="layoutCollapseBtn">⌄</button></div>';
    var body=document.createElement('div'); body.className='layoutSectionBody';
    while(w.firstChild) w.removeChild(w.firstChild);
    w.appendChild(head); w.appendChild(body);
    content.forEach(function(c){body.appendChild(c);});
    head.querySelector('.layoutSectionTitle').textContent=layoutLabel(content[0]||n);
    out.push(w);
  });
  return out;
}
function layoutInitPage(pageId, key, nodeIds){
  var page=$(pageId); if(!page)return;
  var nodes=nodeIds.map(function(id){return $(id);}).filter(Boolean);
  var ws=ensureLayoutWrap(page,nodes,key);
  layoutDefs[key]={page:page,sections:ws};
  var saved=layoutState[key]||{}; var order=saved.order||[];
  var by={}; ws.forEach(function(w){by[w.dataset.layoutKey]=w;});
  var parent=page; order.forEach(function(id){if(by[id]) parent.appendChild(by[id]);});
  ws.forEach(function(w){if(!order.includes(w.dataset.layoutKey)) parent.appendChild(w);});
  var collapsed=saved.collapsed||{}; ws.forEach(function(w){w.classList.toggle('collapsed',!!collapsed[w.dataset.layoutKey]);});
}
function layoutAddButton(pageId,key){
  var page=$(pageId); if(!page)return; var h=page.querySelector('h1'); if(!h)return; var row=h.parentNode; if(row.querySelector('.layoutEditBtn'))return; var b=document.createElement('button');b.className='layoutEditBtn';b.textContent='✎ Edit';b.type='button';b.addEventListener('click',function(){openLayoutEditor(key);});row.classList.add('h1row');row.appendChild(b);
}
function openLayoutEditor(key){
  var def=layoutDefs[key];
  if(!def)return;
  var old=$('layoutSheet');
  if(old)old.remove();

  var sh=document.createElement('div');
  sh.className='sheet layoutSheet';
  sh.id='layoutSheet';
  sh.innerHTML='<div class="grab"></div>'
    +'<h2>Customize '+layoutTabName(key)+'</h2>'
    +'<div class="setS" style="margin-bottom:12px">Reorder sections and choose which ones stay collapsed.</div>'
    +'<div id="layoutItems"></div>'
    +'<button class="primary layoutDone" id="layoutDone">✓ Done</button>';
  document.body.appendChild(sh);

  var items=sh.querySelector('#layoutItems');

  function renderItems(){
    items.innerHTML='';
    def.sections.forEach(function(w,i){
      var row=document.createElement('div');
      row.className='layoutItem';
      var name=(w.querySelector('.layoutSectionTitle')||{}).textContent||layoutLabel(w);
      var col=w.classList.contains('collapsed');
      row.innerHTML='<span class="liGrip">☰</span>'
        +'<span class="liName"></span>'
        +'<span class="liState">'+(col?'Collapsed':'Expanded')+'</span>'
        +'<button type="button" data-move="up" aria-label="Move up">↑</button>'
        +'<button type="button" data-move="down" aria-label="Move down">↓</button>'
        +'<button type="button" data-col="1" aria-label="'+(col?'Expand':'Collapse')+'">'+(col?'›':'⌄')+'</button>';
      row.querySelector('.liName').textContent=name;
      row.querySelector('[data-move="up"]').disabled=i===0;
      row.querySelector('[data-move="down"]').disabled=i===def.sections.length-1;

      row.addEventListener('click',function(e){
        var mv=e.target.getAttribute('data-move');
        if(mv){
          var cur=w;
          var sib=mv==='up'?cur.previousElementSibling:cur.nextElementSibling;
          if(sib && sib.classList.contains('layoutSection')){
            cur.parentNode.insertBefore(cur,mv==='up'?sib:sib.nextElementSibling);
            layoutRefresh(def);
            renderItems();
          }
          return;
        }
        if(e.target.getAttribute('data-col')){
          w.classList.toggle('collapsed');
          layoutRefresh(def);
          renderItems();
        }
      });
      items.appendChild(row);
    });
  }

  renderItems();
  openSheet('layoutSheet');

  sh.querySelector('#layoutDone').addEventListener('click',function(){
    closeSheet();
  });
}
function layoutTabName(k){return ({today:'Today',money:'Money',mood:'Mood',stats:'Stats',journal:'Journal',ai:'AI Assistant',settings:'Settings'})[k]||k;}
function layoutRefresh(def){var arr=Array.prototype.slice.call(def.page.querySelectorAll(':scope > .layoutSection'));def.sections=arr;var saved=layoutState[Object.keys(layoutDefs).find(function(k){return layoutDefs[k]===def;})]||{};saved.order=arr.map(function(w){return w.dataset.layoutKey;});saved.collapsed={};arr.forEach(function(w){saved.collapsed[w.dataset.layoutKey]=w.classList.contains('collapsed');});layoutState[Object.keys(layoutDefs).find(function(k){return layoutDefs[k]===def;})]=saved;layoutSave(layoutState);}
function bindLayoutCollapse(def){var p=def.page;p.addEventListener('click',function(e){var b=climb(e.target,p,'class');if(e.target.classList && e.target.classList.contains('layoutCollapseBtn')){var w=e.target.closest('.layoutSection');if(!w)return;w.classList.toggle('collapsed');layoutRefresh(def);e.stopPropagation();}});}
function initLayoutEditors(){
  layoutInitPage('pgToday','today',['todaySyncBar','srchWrap','todayDIWrap','heroTop','restBox','wkdots','wkCard','qod','nextRem','aiInsights','recoverBox','stackBox','list','empty']);
  layoutInitPage('pgExp','money',['expSum','expMonNav','expSeg','expSrchWrap','expTx','expBudg','expAcct','expIns','receiptActions','expEmpty']);
  layoutInitPage('pgStats','stats',['stEmpty','stMain']);
  (function(){var p=$('pgMood'),kids=Array.prototype.slice.call(p.children),ids=[];for(var i=0;i<kids.length;i++){var n=kids[i];if(n.classList.contains('setCard')||n.classList.contains('sleepCard')){var prev=n.previousElementSibling;if(prev&&prev.classList.contains('lbl')){var w=document.createElement('div');w.id='moodSec'+ids.length;w.className='layoutSectionSeed';p.insertBefore(w,prev);w.appendChild(prev);w.appendChild(n);ids.push(w.id);}else{if(!n.id)n.id='moodCard'+ids.length;ids.push(n.id);}}}layoutInitPage('pgMood','mood',ids.map(function(id){return $(id);}));})();
  layoutInitPage('pgJr','journal',['jrSrchWrap','otdCard','jrList','jrEmpty']);
  layoutInitPage('pgAI','ai',['uaiBox','aiRecent','aiCfg']);
  (function(){var p=$('pgSet'),kids=Array.prototype.slice.call(p.children),ids=[];for(var i=0;i<kids.length;i++){var n=kids[i];if(n.classList.contains('setCard')){var prev=n.previousElementSibling;if(prev&&prev.classList.contains('lbl')){var w=document.createElement('div');w.id='setSec'+ids.length;w.className='layoutSectionSeed';p.insertBefore(w,prev);w.appendChild(prev);w.appendChild(n);ids.push(w.id);}else{if(!n.id)n.id='setCard'+ids.length;ids.push(n.id);}}}layoutInitPage('pgSet','settings',ids.map(function(id){return $(id);}));})();
  Object.keys(layoutDefs).forEach(function(k){bindLayoutCollapse(layoutDefs[k]);});
  layoutAddButton('pgToday','today');layoutAddButton('pgExp','money');layoutAddButton('pgStats','stats');layoutAddButton('pgMood','mood');layoutAddButton('pgJr','journal');layoutAddButton('pgAI','ai');layoutAddButton('pgSet','settings');
}
function receiptFileToData(file){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result);};r.onerror=reject;r.readAsDataURL(file);});}
function receiptParseWithGemini(dataUrl){
  var key=getAiKey(); if(!key) return Promise.reject(new Error('Configure a Gemini API key in AI settings first.'));
  var model=getAiModel()||'gemini-2.5-flash'; var comma=dataUrl.indexOf(','); var b64=dataUrl.slice(comma+1); var mime=(dataUrl.slice(5,comma).split(';')[0]||'image/jpeg');
  var prompt='Read this receipt and return ONLY valid JSON with keys amount, merchant, date, category, subcategory, paymentMethod, note. amount must be a number. date must be YYYY-MM-DD if visible, otherwise empty. category should be one of Food, Transport, Shopping, Bills & Utilities, Entertainment, Health, Other. Do not invent missing values.';
  var url='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent';
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt},{inlineData:{mimeType:mime,data:b64}}]}],generationConfig:{temperature:0.1,maxOutputTokens:300}})}).then(function(r){if(!r.ok)throw new Error('Receipt scan API '+r.status);return r.json();}).then(function(d){var txt=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts&&d.candidates[0].content.parts[0]&&d.candidates[0].content.parts[0].text;if(!txt)throw new Error('No receipt data returned');txt=txt.replace(/^```json\s*|```$/g,'').trim();var o=JSON.parse(txt);return o;});
}
function startReceiptScan(){var inp=$('receiptInput');if(inp)inp.value='';if(inp)inp.click();}
function applyReceiptToExpense(o){
  openExp(null); setTimeout(function(){if(o.amount)$('expAmt').value=o.amount;if(o.merchant)$('expPayee').value=o.merchant;if(o.date){expEd.d=o.date;$('expDateTxt').textContent=niceDate(o.date);}if(o.paymentMethod)$('expMethod').value=o.paymentMethod;if(o.note)$('expNote').value=o.note;if(o.category&&state.cats[o.category]){expCatSel=o.category;expSubSel=o.subcategory||'';paintExpPickers();}if($('expMoreBox').style.display==='none'){$('expMoreBox').style.display='';$('expMore').style.display='none';}toastN('Receipt details loaded — review before saving');},80);
}
function wireReceipt(){var b=$('scanReceiptBtn'),inp=$('receiptInput');if(!b||!inp)return;b.addEventListener('click',startReceiptScan);inp.addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;toastN('Reading receipt…');receiptFileToData(f).then(function(data){return receiptParseWithGemini(data);}).then(applyReceiptToExpense).catch(function(e){toastN(e.message||'Receipt scan failed');});});}
setTimeout(function(){try{initLayoutEditors();wireReceipt();}catch(e){console.error(e);}},0);

if(nat && nat.getLaunchAction){
  try{
    var _la = JSON.parse(nat.getLaunchAction() || '{}');
    if(_la.tab) showTab(_la.tab);
    else if(_la.habit && findHabit(_la.habit)){ showTab('pgToday'); openDetail(_la.habit); }
    else if(_la.add){ openExpFromWidget(_la.add, _la.acct); }
    else if(_la.widgetAction){ window.extOpen('widget', JSON.stringify({action:_la.widgetAction, habitId:_la.habitId||''})); }
    else if(_la.voice){ showTab('pgAI'); setTimeout(function(){ startVoice($('uaiInput'), function(text){ toastN('Got: "'+text+'" — tap ✨ to parse'); }); }, 500); }
  }catch(e){}
}
